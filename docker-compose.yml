version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: sentinelmesh-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./sentinelmesh.db
      - HOST=0.0.0.0
      - PORT=8000
      - DEMO_MODE=true
      - SENTINEL_JWT_SECRET=demo-sentinel-jwt-secret-key-32bytes!
      - SENTINEL_TOKEN_SECRET=demo-sentinel-token-secret-key-32bytes!
      - SENTINEL_VAULT_KEY=k_demo_vault_key_32bytes_placeholder!
    volumes:
      - sentinel-data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: sentinelmesh-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  sentinel-data:
