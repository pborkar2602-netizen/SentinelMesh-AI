name: SentinelMesh CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  linux-build-and-test:
    name: Linux Docker Compose & Benchmark CI
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install httpx pytest pytest-asyncio

      - name: Build and Start Services via Docker Compose
        run: |
          docker compose up --build -d
          echo "Waiting for gateway service on port 8000..."
          timeout 60 bash -c 'until curl -s http://127.0.0.1:8000/docs > /dev/null; do sleep 2; done'
          echo "Gateway service is healthy and responding."

      - name: Run End-to-End Smoke Test over Real HTTP
        run: |
          python scripts/smoke_test.py --gateway-url http://127.0.0.1:8000/api/v1/gateway/execute

      - name: Run Benchmark Evaluation Suite on Linux
        run: |
          python benchmark/run_benchmark.py --split dev --gateway-url http://127.0.0.1:8000/api/v1/gateway/execute

      - name: Tear Down Docker Compose Services
        if: always()
        run: |
          docker compose down -v

      - name: Run Unit & Policy Test Suite
        run: |
          pytest backend/tests/ -v
